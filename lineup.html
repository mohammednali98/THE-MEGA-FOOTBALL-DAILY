  .slot .club { font-weight: 700; flex: 1; }
  .slot .player { color: #2ec4b6; font-weight: 600; text-align: right; }
  .slot.filled { border-color: #2ec4b6; }
  .slot.revealed { border-color: #ef476f; }
  .slot.revealed .player { color: #ef476f; }
  .slot.wrong { border-color: #ef476f; animation: shake .4s; }

  .ac-name { font-weight: 600; }
  .ac-meta { margin-left: auto; font-size: 12px; color: #888; }
  .ac-item mark { background: #ffe58a; padding: 0; }
  .ac-empty { padding: 12px; color: #999; font-size: 13px; text-align: center; }
  #result { display: none; margin-top: 16px; background: #1c2541; border: 2px solid #2ec4b6; border-radius: 14px; padding: 18px; width: 100%; max-width: 480px; text-align: center; }
  #result h2 { margin: 0 0 6px; }

  .back { margin-top: 20px; color: #9fb3d1; font-size: 14px; }
</style>

/* ===== SEARCH ENGINE ===== */
function normalize(str) {
  return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, "").trim().replace(/\s+/g, " ");
}
const indexCache = new WeakMap();
function getIndex(db) {
  if (!indexCache.has(db)) {
    indexCache.set(db, db.map(p => ({ player: p, keys: [normalize(p.name), ...(p.aliases || []).map(normalize)] })));
  }
  return indexCache.get(db);
}
function searchPlayers(query, { source = PLAYERS_DB, exclude = [], filterFn = null, limit = 8 } = {}) {
  const q = normalize(query);
  if (!q) return [];
  const excludedIds = new Set(exclude.map(p => p.id));
  const buckets = [[], [], []];
  for (const { player, keys } of getIndex(source)) {
    if (excludedIds.has(player.id)) continue;
    if (filterFn && !filterFn(player)) continue;
    let rank = -1;
    for (const key of keys) {
      const r = key.startsWith(q) ? 0 : key.includes(" " + q) ? 1 : key.includes(q) ? 2 : -1;
      if (r === 0) { rank = 0; break; }
      if (r !== -1 && (rank === -1 || r < rank)) rank = r;
    }
    if (rank !== -1) buckets[rank].push(player);
  }
  return [...buckets[0], ...buckets[1], ...buckets[2]].slice(0, limit);
}

/* ===== AUTOCOMPLETE DROPDOWN ===== */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function highlight(name, q) {
  const i = name.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(name) : esc(name.slice(0, i)) + "<mark>" + esc(name.slice(i, i + q.length)) + "</mark>" + esc(name.slice(i + q.length));
}
function attachAutocomplete(inputEl, opts = {}) {
  const { source = PLAYERS_DB, onSelect = () => {}, getExclude = () => [], filterFn = null, limit = 8, minChars = 1 } = opts;
  let wrapper = inputEl.parentElement;
  if (!wrapper.classList.contains("ac-wrapper")) {
    wrapper = document.createElement("div");
    wrapper.className = "ac-wrapper";
    inputEl.before(wrapper);
    wrapper.appendChild(inputEl);
  }
  const dropdown = document.createElement("div");
  dropdown.className = "ac-dropdown";
  wrapper.appendChild(dropdown);
  let results = [], active = -1;
  const close = () => { dropdown.style.display = "none"; active = -1; };
  function render() {
    dropdown.innerHTML = results.length
      ? results.map((p, i) => `
          <div class="ac-item ${i === active ? "active" : ""}" data-i="${i}">
            <span>${p.flag || ""}</span>
            <span class="ac-name">${highlight(p.name, inputEl.value.trim())}</span>
            <span class="ac-meta">${esc(p.club || "")}</span>
          </div>`).join("")
      : `<div class="ac-empty">No matches found</div>`;
    dropdown.style.display = "block";
  }
  function choose(i) {
    const p = results[i];
    if (!p) return;
    close();
    inputEl.value = "";
    onSelect(p);
  }
  inputEl.addEventListener("input", () => {
    const v = inputEl.value.trim();
    if (v.length < minChars) { close(); return; }
    results = searchPlayers(v, { source, exclude: getExclude(), filterFn, limit });
    active = results.length ? 0 : -1;
    render();
  });
  inputEl.addEventListener("keydown", e => {
    if (dropdown.style.display !== "block" || !results.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); active = (active + 1) % results.length; render(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); active = (active - 1 + results.length) % results.length; render(); }
    else if (e.key === "Enter") { e.preventDefault(); choose(active >= 0 ? active : 0); }
    else if (e.key === "Escape") close();
  });
  dropdown.addEventListener("pointerdown", e => {
    const item = e.target.closest(".ac-item");
    if (item) { e.preventDefault(); choose(+item.dataset.i); }
  });
  inputEl.addEventListener("blur", () => setTimeout(close, 150));
  inputEl.setAttribute("autocomplete", "off");
}

/* ===== DAILY SEED (same puzzle for everyone, changes at midnight) ===== */
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const now = new Date();
const dateKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");
const rand = mulberry32(parseInt(dateKey.replace(/-/g, ""), 10));
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const clubSet = new Set();
PLAYERS_DB.forEach(p => p.clubs.forEach(c => clubSet.add(c)));
const todaysClubs = shuffle([...clubSet]).slice(0, 11);

/* ===== GAME STATE ===== */
const SAVE_KEY = "lineup-" + dateKey;
let state = { mode: null, seconds: 0, mistakes: 0, placed: Array(11).fill(null), status: "start" };
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function load() {
  const s = localStorage.getItem(SAVE_KEY);
  if (s) { try { state = { ...state, ...JSON.parse(s) }; return true; } catch (e) {} }
  return false;
}

/* ===== TIMER ===== */
let timerInt = null;
function startTimer() {
  if (state.mode !== "timed" || timerInt) return;
  timerInt = setInterval(() => { state.seconds++; save(); renderTimer(); }, 1000);
}
function stopTimer() { clearInterval(timerInt); timerInt = null; }
function renderTimer() {
  const el = document.getElementById("timer");
  if (state.mode !== "timed") { el.textContent = ""; return; }
  const m = String(Math.floor(state.seconds / 60)).padStart(2, "0");
  const s = String(state.seconds % 60).padStart(2, "0");
  el.textContent = "⏱ " + m + ":" + s;
}
function renderMistakes() {
  document.getElementById("mistakes").textContent = state.mistakes > 0 ? "❌ " + state.mistakes : "";
}

/* ===== RENDER ===== */
function renderSlots() {
  const wrap = document.getElementById("slots");
  wrap.innerHTML = "";
  todaysClubs.forEach((club, i) => {
    const row = document.createElement("div");
    row.className = "slot";
    const p = state.placed[i];
    if (p) {
      row.classList.add("filled");
      row.innerHTML = `<span class="club">${club}</span><span class="player">${p.flag} ${p.name}</span>`;
    } else if (state.status === "playing") {
      row.innerHTML = `<span class="club">${club}</span>`;
      const input = document.createElement("input");
      input.placeholder = "Type a player...";
      row.appendChild(input);
      attachAutocomplete(input, {
        getExclude: () => state.placed.filter(Boolean),
        onSelect: pl => tryPlace(i, pl)
      });
    } else if (state.status === "gaveup") {
      const ans = PLAYERS_DB.find(pl => pl.clubs.includes(club));
      row.classList.add("revealed");
      row.innerHTML = `<span class="club">${club}</span><span class="player">${ans.flag} ${ans.name}</span>`;
    } else {
      row.innerHTML = `<span class="club">${club}</span><span class="player">—</span>`;
    }
    wrap.appendChild(row);
  });
}
function showResult(title, sub) {
  const r = document.getElementById("result");
  r.innerHTML = `<h2>${title}</h2><p>${sub}</p>`;
  r.style.display = "block";
  document.getElementById("giveUp").style.display = "none";
}

/* ===== GAME LOGIC ===== */
function tryPlace(slotIdx, player) {
  const alreadyUsed = state.placed.some(p => p && p.id === player.id);
  const correctClub = player.clubs.includes(todaysClubs[slotIdx]);
  if (alreadyUsed || !correctClub) {
    state.mistakes++;
    save();
    renderMistakes();
    const row = document.getElementById("slots").children[slotIdx];
    row.classList.add("wrong");
    setTimeout(() => row.classList.remove("wrong"), 500);
    return;
  }
  state.placed[slotIdx] = player;
  save();
  renderSlots();
  if (state.placed.filter(Boolean).length === 11) {
    state.status = "won";
    stopTimer();
    save();
    const timeTxt = state.mode === "timed" ? `Time: ${Math.floor(state.seconds / 60)}m ${state.seconds % 60}s • ` : "";
    showResult("🎉 Full lineup complete!", `${timeTxt}Mistakes: ${state.mistakes}. Come back tomorrow for a new lineup!`);
  }
}

function startGame(mode) {
  state = { mode, seconds: 0, mistakes: 0, placed: Array(11).fill(null), status: "playing" };
  save();
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("game").style.display = "block";
  renderSlots();
  renderTimer();
  renderMistakes();
  startTimer();
}

document.getElementById("btnTimed").onclick = () => startGame("timed");
document.getElementById("btnUntimed").onclick = () => startGame("untimed");

document.getElementById("giveUp").onclick = () => {
  if (!confirm("Reveal the answers and give up?")) return;
  state.status = "gaveup";
  stopTimer();
  save();
  renderSlots();
  showResult("🏳️ Given up", "The full lineup is revealed. Come back tomorrow for a new challenge!");
};

/* ===== INIT ===== */
document.getElementById("dateLabel").textContent = now.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
const hadSave = load();
if (hadSave && state.status !== "start") {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("game").style.display = "block";
  renderSlots();
  renderTimer();
  renderMistakes();
  if (state.status === "playing") startTimer();
  if (state.status === "won") {
    const timeTxt = state.mode === "timed" ? `Time: ${Math.floor(state.seconds / 60)}m ${state.seconds % 60}s • ` : "";
    showResult("🎉 Full lineup complete!", `${timeTxt}Mistakes: ${state.mistakes}. Come back tomorrow for a new lineup!`);
  }
  if (state.status === "gaveup") showResult("🏳️ Given up", "The full lineup is revealed. Come back tomorrow for a new challenge!");
}
</script>
