<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE MEGA FOOTBALL DAILY</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0a3d1f, #062b15);
    color: #fff;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 26px; text-align: center; margin: 10px 0 4px;
    color: #ffd700; text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .date { opacity: .8; margin-bottom: 16px; font-size: 14px; }
  .streak {
    background: rgba(255,255,255,.1); border: 1px solid #ffd700;
    padding: 8px 18px; border-radius: 30px; margin-bottom: 20px; font-weight: bold;
  }
  .card {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 16px; padding: 24px;
    max-width: 480px; width: 100%; text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.4);
  }
  .badge {
    display: inline-block; background: #ffd700; color: #062b15;
    padding: 4px 14px; border-radius: 20px; font-size: 12px;
    font-weight: bold; margin-bottom: 14px; text-transform: uppercase;
  }
  .question { font-size: 18px; line-height: 1.6; margin-bottom: 20px; }
  .clue { display: block; opacity: .9; margin: 4px 0; }
  input {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    font-size: 16px; text-align: center; outline: none; margin-bottom: 12px;
  }
  button {
    background: #ffd700; color: #062b15; border: none;
    padding: 12px 30px; border-radius: 10px; font-size: 16px;
    font-weight: bold; cursor: pointer; width: 100%;
  }
  button:hover { background: #ffea70; }
  .feedback { margin-top: 16px; font-size: 16px; font-weight: bold; min-height: 24px; }
  .correct { color: #6dff8f; }
  .wrong { color: #ff7b7b; }
  .done { font-size: 18px; line-height: 1.6; }
  .timer { margin-top: 14px; opacity: .8; font-size: 14px; }
  footer { margin-top: 24px; opacity: .5; font-size: 12px; }
</style>
</head>
<body>

<h1>⚽ THE MEGA FOOTBALL DAILY ⚽</h1>
<div class="date" id="todayDate"></div>
<div class="streak" id="streakBox">🔥 Streak: 0 days</div>

<div class="card" id="card"></div>

<footer>One challenge per day — come back tomorrow!</footer>

<script>
// ============ CHALLENGE BANK ============
// Add new challenges here! They rotate automatically every day.
const challenges = [
  { type: "Trivia", q: "Which country has won the most World Cups? 🏆", answers: ["brazil"] },
  { type: "Guess the Player", q: "🇪🇬 Egyptian<br>🔴 Plays for Liverpool<br>⚡ Known as the Egyptian King", answers: ["salah", "mohamed salah", "mo salah"] },
  { type: "Guess the Score", q: "2022 World Cup Final 🇦🇷 vs 🇫🇷 — score after penalties?", answers: ["4-2", "4 - 2"] },
  { type: "Trivia", q: "Which club has won the most Champions League titles? 🏆", answers: ["real madrid", "real"] },
  { type: "Guess the Player", q: "🇵🇹 Portuguese<br>5 Ballon d'Ors<br>😱 Famous for saying 'Siuuu!'", answers: ["cristiano ronaldo", "ronaldo", "cr7"] },
  { type: "Trivia", q: "How many players from each team are on the pitch? ⚽", answers: ["11", "eleven"] },
  { type: "Guess the Player", q: "🇦🇷 Argentine<br>8 Ballon d'Ors<br>🏆 Won the 2022 World Cup", answers: ["messi", "lionel messi", "leo messi"] },
  { type: "Trivia", q: "Which country hosted the 2022 World Cup? 🌍", answers: ["qatar"] },
  { type: "Guess the Score", q: "La Remontada 2017: Barcelona 6 - ? PSG 😱", answers: ["1", "6-1"] },
  { type: "Trivia", q: "Which club plays its home games at Anfield? 🏟️", answers: ["liverpool"] }
];

// ============ DAILY LOGIC ============
const dayIndex = Math.floor(Date.now() / 86400000); // days since 1970
const today = challenges[dayIndex % challenges.length];

const card = document.getElementById("card");
const streakBox = document.getElementById("streakBox");

document.getElementById("todayDate").textContent =
  new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

// Streak system (saved in your browser)
let streak = parseInt(localStorage.getItem("mfd_streak") || "0");
let lastDay = parseInt(localStorage.getItem("mfd_lastDay") || "-1");
if (lastDay === dayIndex - 1) { /* streak continues */ }
else if (lastDay !== dayIndex) { streak = 0; }
streakBox.textContent = "🔥 Streak: " + streak + " day" + (streak === 1 ? "" : "s");

function normalize(str) {
  return str.toLowerCase().trim().replace(/\s+/g, " ");
}

function checkAnswer() {
  const input = normalize(document.getElementById("answerInput").value);
  if (!input) return;
  if (today.answers.some(a => normalize(a) === input)) {
    // Correct! Update streak
    streak = (lastDay === dayIndex - 1) ? streak + 1 : 1;
    localStorage.setItem("mfd_streak", streak);
    localStorage.setItem("mfd_lastDay", dayIndex);
    streakBox.textContent = "🔥 Streak: " + streak + " day" + (streak === 1 ? "" : "s");
    showDone(true);
  } else {
    document.getElementById("feedback").textContent = "❌ Wrong! Try again...";
    document.getElementById("feedback").className = "feedback wrong";
  }
}

function showDone(wasCorrect) {
  const hours = 23 - new Date().getHours();
  card.innerHTML = `
    <div class="badge">${today.type}</div>
    <div class="done">${wasCorrect ? "✅ <b>Correct!</b> Come back tomorrow for a new challenge! ⚽" : "⏰ Already played today. New challenge tomorrow!"}</div>
    <div class="timer">Next challenge in: <b id="countdown">--:--:--</b></div>`;
  setInterval(() => {
    const now = new Date();
    const end = new Date(now); end.setHours(24,0,0,0);
    const diff = end - now;
    const h = String(Math.floor(diff/3600000)).padStart(2,"0");
    const m = String(Math.floor(diff%3600000/60000)).padStart(2,"0");
    const s = String(Math.floor(diff%60000/1000)).padStart(2,"0");
    const el = document.getElementById("countdown");
    if (el) el.textContent = `${h}:${m}:${s}`;
  }, 1000);
}

// Render today's challenge (or show done screen)
if (lastDay === dayIndex) {
  showDone(false);
} else {
  card.innerHTML = `
    <div class="badge">${today.type}</div>
    <div class="question">${today.q}</div>
    <input id="answerInput" placeholder="Type your answer..." autocomplete="off">
    <button onclick="checkAnswer()">SUBMIT ✅</button>
    <div class="feedback" id="feedback"></div>`;
  document.getElementById("answerInput").addEventListener("keydown", e => {
    if (e.key === "Enter") checkAnswer();
  });
}
</script>
</body>
</html>
